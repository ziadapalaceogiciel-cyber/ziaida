  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

y: swap;\n  src: url(\"8f7cb9c8-5f65-402d-9504-3f8ea6adff99\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html,body{margin:0;padding:0;background:#F2EDE2;font-family:'Jost',sans-serif;color:#24312A;}\n  *{box-sizing:border-box;}\n  a{color:#8C6A2F;text-decoration:none;} a:hover{color:#BA8D48;}\n  input,select,textarea,button{font-family:'Jost',sans-serif;}\n  input:focus,select:focus,textarea:focus{outline:2px solid #BA8D48;outline-offset:-1px;}\n  ::placeholder{color:#A8A292;}\n  @keyframes zp-fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}\n  @keyframes zp-pulse{0%,100%{box-shadow:0 0 0 0 rgba(140,59,50,.55);}50%{box-shadow:0 0 0 6px rgba(140,59,50,0);}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<!-- ============ CONNEXION ============ -->\n<sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ true }}\">\n<div data-screen-label=\"Connexion\" style=\"min-height:100vh;display:flex;background:linear-gradient(135deg,#0E2A1D 0%,#123524 55%,#1B4531 100%);\">\n  <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px;gap:8px;\">\n    <img src=\"4d081f1a-c24b-4c9b-8b6e-302878aeebac\" alt=\"Ziada Palace &amp; Spa\" style=\"width:280px;margin-bottom:8px;\">\n    <div style=\"font-family:'Cormorant Garamond',serif;font-size:20px;color:#D8C072;letter-spacing:6px;text-transform:uppercase;\">Property Management System<\u002Fdiv>\n    <div style=\"font-size:14px;color:#7FA08D;letter-spacing:1px;margin-top:6px;\">Benslimane · Maroc<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"width:520px;background:#F7F3E9;display:flex;flex-direction:column;justify-content:center;padding:56px;gap:24px;box-shadow:-12px 0 40px rgba(0,0,0,.35);\">\n    <div>\n      <div style=\"font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;color:#123524;\">Connexion<\u002Fdiv>\n      <div style=\"font-size:14px;color:#6B7568;margin-top:4px;\">{{ loginStepTxt }}<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ loginStep1 }}\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:380px;overflow-y:auto;\">\n        <sc-for list=\"{{ roleCards }}\" as=\"rc\" hint-placeholder-count=\"8\">\n          <button sc-camel-on-click=\"{{ rc.go }}\" style=\"display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:12px 14px;background:#FFFFFF;border:1px solid #E2DAC6;border-radius:6px;cursor:pointer;text-align:left;\" style-hover=\"border-color:#BA8D48;box-shadow:0 2px 10px rgba(186,141,72,.25);\">\n            <span style=\"font-size:14px;font-weight:500;color:#123524;\">{{ rc.role }}<\u002Fspan>\n            <span style=\"font-size:12px;color:#8A9186;\">{{ rc.who }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ loginStep2 }}\">\n      <div style=\"display:flex;align-items:center;gap:10px;background:#FFFFFF;border:1px solid #E2DAC6;border-radius:6px;padding:12px 14px;\">\n        <div style=\"flex:1;\">\n          <div style=\"font-size:14px;font-weight:500;color:#123524;\">Espace : {{ pickedRole }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#8A9186;\">{{ pickedWho }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ backToRoles }}\" style=\"background:none;border:1px solid #DDD5C2;border-radius:5px;color:#8C6A2F;cursor:pointer;padding:6px 12px;font-size:12px;\" style-hover=\"border-color:#BA8D48;\">Changer<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <label style=\"display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:#6B7568;\">Nom d'utilisateur\n          <input value=\"{{ loginUser }}\" sc-camel-on-change=\"{{ setLoginUser }}\" sc-camel-on-key-down=\"{{ loginKey u002Fsc-if>\n                <sc-if value=\"{{ ac2.resetClosed }}\">\n                  <sc-if value=\"{{ sgCanSave }}\">\n                    <button sc-camel-on-click=\"{{ ac2.openReset }}\" title=\"Réinitialiser le mot de passe\" style=\"background:#FFFFFF;border:1px solid #DDD5C2;color:#41504A;border-radius:4px;padding:4px 8px;font-size:11px;cursor:pointer;\" style-hover=\"border-color:#BA8D48;\">🔑<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ ac2.toggle }}\" style=\"background:#FFFFFF;border:1px solid #DDD5C2;color:#41504A;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;\" style-hover=\"border-color:#BA8D48;\">{{ ac2.toggleTxt }}<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ ac2.del }}\" style=\"background:#FFFFFF;border:1px solid #E5C4B8;color:#8C3B32;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;\" style-hover=\"background:#F9EFEA;\">Supprimer<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fsc-if>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ sgCanSave }}\">\n          <button sc-camel-on-click=\"{{ sgSave }}\" style=\"align-self:flex-start;background:#123524;color:#F1ED96;border:none;border-radius:6px;padding:11px 24px;font-size:13.5px;cursor:pointer;\" style-hover=\"background:#1B4531;\">Enregistrer les réglages<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Aperçu document -->\n<sc-if value=\"{{ hasDocPreview }}\">\n  <div sc-camel-on-click=\"{{ dpClose }}\" style=\"position:fixed;inset:0;background:rgba(10,26,18,.7);display:flex;align-items:center;justify-content:center;z-index:95;padding:30px;\">\n    <div sc-camel-on-click=\"{{ dpStop }}\" style=\"background:#FFFFFF;border-radius:10px;width:720px;max-width:95vw;height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60p (0,0,0,0) - new Date(2026, 6, 0).setHours(0,0,0,0)) \u002F 86400000); \u002F\u002F jour réel (série depuis juillet 2026)\n    \u002F\u002F ---- chambres ----\n    const rooms = [];\n    const eqBase = ['Wi-Fi', 'Climatisation', 'TV satellite', 'Coffre-fort'];\n    const statusSeed = ['occupee','libre','occupee','reservee','libre','sale','occupee','libre','nettoyage','occupee','libre','reservee'];\n    for (let f = 1; f <= 4; f++) {\n      for (let i = 1; i <= 12; i++) {\n        const no = String(f * 100 + i);\n        let type = 'Standard', cap = 2, price = 850, eq = [...eqBase, 'Minibar'];\n        if (i >= 7 && i <= 9) { type = 'Deluxe'; cap = 2; price = 1250; eq = [...eqBase, 'Minibar', 'Balcon', 'Machine à café']; }\n        if (i === 10 || i === 11) { type = 'Suite Junior'; cap = 3; price = 2100; eq = [...eqBase, 'Minibar', 'Salon', 'Baignoire jacuzzi']; }\n        if (i === 12) { type = 'Suite Royale'; cap = 4; price = 3800; eq = [...eqBase, 'Minibar', 'Salon', 'Terrasse privée', 'Majordome']; }\n        if (f === 4 && i <= 4) { type = 'Familiale'; cap = 5; price = 1650; eq = [...eqBase, 'Minibar', 'Lits superposés', 'Kitchenette']; }\n        let status = statusSeed[(f * 5 + i) % 12];\n        if (no === '212') status = 'maintenance';\n        if (no === '407') status = 'hs';\n        rooms.push({ no, floor: f, type, cap, price, status, eq });\n      }\n    }\n    \u002F\u002F ---- clients ----\n    const clients = [];\n    \u002F\u002F ---- réservations (folio = lignes hors nuitées) ----\n    const R = (id, clientId, room, arr, dep, ad, ch, source, status, folio, deposit) => {\n      const c = clients.find(x => x.id === clientId);\n      const rm = rooms.find(x => x.no === room);\n      const nights = dep - arr;\n      return { id, clientId, client: c.name, phone: c.phone, room, type: rm.type, price: rm.price, arr, dep, arrTxt: arr + '\u002F07', depTxt: dep + '\u002F07', nights, adults: ad, children: ch, source, status, folio: folio || [], deposit: deposit ' : '#E5C4B8',\n          togglePresent: () => this.toggleStaff(p.id, 'present'),\n          showActive: admin,\n          acTxt: p.active ? 'Compte actif' : 'Compte suspendu', acFg: p.active ? '#2E7D57' : '#8C3B32',\n          toggleActive: () => this.toggleStaff(p.id, 'active'),\n          del: () => { this.setState(st => ({ staff: st.staff.filter(x => x.id !== p.id) })); this.toast(p.name + ' retiré du personnel'); },\n        })) };\n      });\n    }\n\n    \u002F\u002F --- comptabilité ---\n    v.vCompta = s.view === 'compta';\n    if (v.vCompta) {\n      const ctDay = s.ctViewDate != null ? s.ctViewDate : s.today;\n      const ctIsToday = ctDay === s.today;\n      const ctDayObj = this.dayDate(ctDay);\n      const ctDayShort = String(ctDayObj.getDate()).padStart(2, '0') + '\u002F' + String(ctDayObj.getMonth() + 1).padStart(2, '0');\n      v.ctDateLabel = ctIsToday ? 'Aujourd\\'hui — ' + this.fmtDay(ctDay) : this.fmtDay(ctDay);\n      v.ctNavNotToday = !ctIsToday;\n      v.ctDateIso = this.isoLocalDate(ctDayObj);\n      v.ctPick = e => { if (!e.target.value) return; const picked = new Date(e.target.value + 'T00:00:00'); this.setState({ ctViewDate: this.serialFromDate(picked) }); };\n      v.ctPrev = () => this.setState({ ctViewDate: ctDay - 1 });\n      v.ctNext = () => this.setState({ ctViewDate: ctDay + 1 });\n      v.ctViewToday = () => this.setState({ ctViewDate: null });\n      v.ctInLabel = ctIsToday ? 'Recettes du jour' : 'Recettes — ' + this.fmtDay(ctDay);\n      v.ctOutLabel = ctIsToday ? 'Dépenses du jour' : 'Dépenses — ' + this.fmtDay(ctDay);\n      v.ctCashierLabel = ctIsToday ? 'aujourd\\'hui' : this.fmtDay(ctDay);\n      const today = s.transactions.filter(x => x.date.startsWith(ctDayShort));\n      const tin = today.filter(x => x.type === 'recette').reduce((a, b) => a + b.amount, 0);\n      const tout = today.filter(x => x.type === 'depense').reduce((a, b) => a + b.amount, 0);\n      v.ctIn = fmt(tin); v.ctOut = fmt(tout); v.ctNet = fmt(tin - tout);\n      const byCashier = {};\n      today.forEach(x => {\n        const who = x.by || 'Non renseigné';\n        if (!byCashier[who]) byCashier[who] = { in: 0, out: 0 };\n        if (x.type === 'recette') byCashier[who].in += x.amount; else byCashier[who].out += x.amount;\n      });\n      v.ctByCashier = Object.entries(byCashier).sort((a, b) => a[0].localeCompare(b[0])).map(([who, v2]) => ({ who, inTxt: fmt(v2.in), outTxt: fmt(v2.out), netTxt: fmt(v2.in - v2.out) }));\n      v.ctHasByCashier = v.ctByCashier.length > 0;\n      const monthsCT = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];\n      v.ctMonthLabel = monthsCT[new Date().getMonth()];\n      v.ctMonth = fmt(s.transactions.filter(x => x.type === 'recette' && x.date.slice(3, 5) === this.todayShort().slice(3, 5)).reduce((a, b) => a + b.amount, 0));\n      v.ctList = s.transactions.map(x => ({ ...x, byTxt: x.by ? 'par ' + x.by : '', amountTxt: (x.type === 'recette' ? '+ ' : '− ') + fmt(x.amount), color: x.type === 'recette' ? '#2E7D57' : '#8C3B32' }));\n      const closedToday = (s.cashClosures || []).find(c => c.date === this.todayShort());\n      v.ctClosedToday = !!closedToday;\n      v.ctNotClosed = !closedToday;\n      v.ctClosedTxt = closedToday ? 'Caisse clôturée à ' + closedToday.at.split(' ')[1] + ' par ' + closedToday.by + ' — solde ' + fmt(closedToday.net) : '';\n      v.ctHasClosures = (s.cashClosures || []).length > 0;\n      v.ctClosuresList = (s.cashClosures || []).map(c => ({ id: c.id, dateTxt: c.date, inTxt: fmt(c.in), outTxt: fmt(c.out), netTxt: fmt(c.net), by: c.by, atTxt: c.at ? c.at.split(' ')[1] : '' }));\n      v.ctClose = () => {\n        if ((s.cashClosures || []).some(c => c.date === this.todayShort())) { this.toast('La caisse du ' + this.todayShort() + ' est déjà clôturée'); return; }\n        const closure = { id: 'CL-' + (1 + (s.cashClosures || []).length), date: this.todayShort(), in: tin, out: tout, net: tin - tout, by: this.who(), at: this.nowStamp() };\n        this.setState(st => ({ cashClosures: [closure, ...(st.cashClosures || [])] }));\n        this.logAct('Clôture de caisse', 'Caisse du ' + this.todayShort() + ' clôturée — solde ' + fmt(tin - tout));\n        this.toast('Caisse du ' + this.todayShort() + ' clôturée — solde net ' + fmt(tin - tout));\n      };\n      v.ctExport = () => {\n        const rows = [['Référence', 'Date', 'Libellé', 'Service', 'Type', 'Mode', 'Montant (MAD)', 'Par']];\n        s.transactions.forEach(x => rows.push([x.id, x.date, x.label, x.service, x.type === 'recette' ? 'Recette' : 'Dépense', x.mode, (x.type === 'recette' ? '' : '-') + x.amount, x.by || '—']));\n        const csv = '\\ufeff' + rows.map(r => r.map(c => '\"' + String(c).replace(\u002F\"\u002Fg, '\"\"') + '\"').join(';')).join('\\n');\n        const a = document.createElement('a');\n        a.href = URL.createObjectURL(new Blob([csv], { type: 'text\u002Fcsv;charset=utf-8' }));\n        a.download = 'caisse-ziada-palace-' + this.todayFull().split('\u002F').join('-') + '.csv';\n        a.click();\n        URL.revokeObjectURL(a.href);\n        this.logAct('Export caisse', s.transactions.length + ' écritures exportées en CSV');\n        this.toast('Journal de caisse exporté — ' + s.transactions.length + ' écritures (CSV)');\n      };\n      v.ctPrint = () => {\n        const rows = s.transactions.map(x => '<tr><td>' + x.id + '<\u002Ftd><td>' + x.date + '<\u002Ftd><td>' + x.label + '<\u002Ftd><td>' + x.service + '<\u002Ftd><td>' + x.mode + '<\u002Ftd><td style=\"text-align:right;color:' + (x.type === 'recette' ? '#2E7D57' : '#8C3B32') + '\">' + (x.type === 'recette' ? '+' : '−') + ' ' + fmt(x.amount) + '<\u002Ftd><\u002Ftr>').join('');\n        const html = '<html><head><title>Journal de caisse<\u002Ftitle><style>body{font-family:Georgia,serif;color:#1a2b22;margin:30px}h1{font-size:20px;border-bottom:3px solid #123524;padding-bottom:8px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px 5px;border-bottom:1px solid #eee;text-align:left}.muted{color:#777;font-size:11px}<\u002Fstyle><\u002Fhead><body>'\n          + '<h1>' + s.settings.name + ' — Journal de caisse du ' + this.todayFull() + '<\u002Fh1>'\n          + '<p class=\"muted\">Recettes : ' + v.ctIn + ' · Dépenses : ' + v.ctOut + ' · Solde net : ' + v.ctNet + '<\u002Fp>'\n          + '<table><tr><th>Réf.<\u002Fth><th>Date<\u002Fth><th>Libellé<\u002Fth><th>Service<\u002Fth><th>Mode<\u002Fth><th style=\"text-align:right\">Montant<\u002Fth><\u002Ftr>' + rows + '<\u002Ftable>'\n          + '<p class=\"muted\">Édité par ' + this.who() + '<\u002Fp><\u002Fbody><\u002Fhtml>';\n        this.printDoc2(html);\n        this.toast('Journal de caisse envoyé à l\\'impression');\n      };\n      v.ctShowNew = s.showNewTx;\n      v.ctNewBtnTxt = s.showNewTx ? 'Fermer' : '+ Nouvelle écriture';\n      v.ctToggleNew = () => this.setState(st => ({ showNewTx: !st.showNewTx }));\n      const setT = (k) => e => this.setState(st => ({ txf: { ...st.txf, [k]: e.target.value } }));\n      v.txf = {\n        label: s.txf.label, setLabel: setT('label'),\n        type: s.txf.type, setType: setT('type'),\n        service: s.txf.service, setService: setT('service'),\n        amount: s.txf.amount, setAmount: setT('amount'),\n        mode: s.txf.mode, setMode: setT('mode'),\n        save: () => {\n          const a = +s.txf.amount;\n          if (!s.txf.label.trim()) { this.toast('Le libellé est obligatoire'); return; }\n          if (!a || a <= 0) { this.toast('Montant invalide'); return; }\n          if ((s.cashClosures || []).some(c => c.date === this.todayShort())) { this.toast('Caisse déjà clôturée pour aujourd\\'hui'); return; }\n          this.setState(st => ({\n            transactions: [{ id: 'TX-' + (1 + st.transactions.length), label: st.txf.label.trim(), type: st.txf.type, service: st.txf.service, amount: a, mode: st.txf.mode, date: this.nowStamp(), by: this.who() }, ...st.transactions],\n            txf: { ...st.txf, label: '', amount: '' }, showNewTx: false,\n          }));\n          this.toast('Écriture enregistrée — ' + (s.txf.type === 'recette' ? '+ ' : '− ') + this.fmt(a));\n        },\n      };\n    }\n\n    \u002F\u002F --- paie ---\n    v.vPayroll = s.view === 'payroll';\n    if (v.vPayroll) {\n      const now = new Date();\n      const monthsPR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];\n      const monthKeyPR = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');\n      const monthLabelPR = monthsPR[now.getMonth()] + ' ' + now.getFullYear();\n      v.prMonthLabel = monthLabelPR;\n      v.prStaffList = s.staff.filter(p => p.active !== false).map(p => ({\n        id: p.id, name: p.name, dept: p.dept, role: p.role, salary: p.salary || 0, salaryTxt: fmt(p.salary || 0),\n        setSalary: e => this.setState(st => ({ staff: st.staff.map(x => x.id === p.id ? { ...x, salary: Math.max(0, +e.target.value || 0) } : x) })),\n      }));\n      v.prTotalTxt = fmt(v.prStaffList.reduce((a, b) => a + b.salary, 0));\n      const alreadyRunPR = (s.payrollRuns || []).some(r => r.monthKey === monthKeyPR);\n      v.prAlreadyRun = alreadyRunPR;\n      v.prCanRun = !alreadyRunPR;\n      v.prRun = () => {\n        if ((s.payrollRuns || []).some(r => r.monthKey === monthKeyPR)) { this.toast('La paie de ' + monthLabelPR + ' a déjà été générée'); return; }\n        const items = s.staff.filter(p => p.active !== false && (p.salary || 0) > 0).map(p => ({ staffId: p.id, name: p.name, dept: p.dept, amount: p.salary }));\n        const total = items.reduce((a, b) => a + b.amount, 0);\n        if (!total) { this.toast('Aucun salaire configuré — renseignez les salaires avant de générer la paie'); return; }\n        const run = { id: 'PAY-' + (1 + (s.payrollRuns || []).length), monthKey: monthKeyPR, monthLabel: monthLabelPR, items, total, by: this.who(), at: this.nowStamp() };\n        this.setState(st => ({\n          payrollRuns: [run, ...(st.payrollRuns || [])],\n          transactions: [{ id: 'TX-' + (1 + st.transactions.length), label: 'Salaires — ' + monthLabelPR, type: 'depense', service: 'Salaires', amount: total, mode: 'Virement', date: this.nowStamp(), by: this.who() }, ...st.transactions],\n        }));\n        this.logAct('Paie', 'Paie de ' + monthLabelPR + ' générée — ' + fmt(total) + ' (' + items.length + ' employés)');\n        this.toast('Paie de ' + monthLabelPR + ' générée — ' + fmt(total));\n      };\n      v.prRunsList = (s.payrollRuns || []).map(r => ({ ...r, totalTxt: fmt(r.total), countTxt: r.items.length + ' employé(s)', print: () => this.printPayroll(r) }));\n      v.prHasRuns = (s.payrollRuns || []).length > 0;\n    }\n\n    \u002F\u002F --- rapports ---\n    v.vReports = s.view === 'reports';\n    if (v.vReports) {\n      \u002F\u002F occupation réelle sur 30 jours (14\u002F07 → 12\u002F08) d'après les réservations\n      const activeRooms = Math.max(1, s.rooms.filter(r => r.status !== 'hs').length);\n      const occ = [];\n      for (let d = s.today; d < s.today + 30; d++) {\n        const n = s.reservations.filter(x => (x.status === 'confirmee' || x.status === 'inhouse') && d >= x.arr && d < x.dep).length;\n        occ.push([d, Math.round(n \u002F activeRooms * 100)]);\n      }\n      v.rpOcc = occ.map(([d, p], i) => {\n        const dt = this.dayDate(d);\n        return { day: (i % 5 === 0 || i === 29) ? String(dt.getDate()).padStart(2, '0') + '\u002F' + String(dt.getMonth() + 1).padStart(2, '0') : '', h: Math.max(6, Math.round(p * 1.4)) + 'px', bg: i === 0 ? '#123524' : '#BA8D48', title: this.fmtDay(d) + ' — ' + p + ' % d\\'occupation' };\n      });\n      \u002F\u002F CA du mois en cours uniquement (comme le Tableau de bord et la Comptabilité) — auparavant\n      \u002F\u002F cette somme portait sur TOUTES les recettes depuis le début de l\\'activité, sans filtre de date.\n      const months );\n      v.rpRevPAR = fmt(Math.round(baseRev['Hébergement'] \u002F (activeRooms * 30)));\n      const nightsArr = s.reservations.map(r => r.nights || 0).filter(Boolean);\n      v.rpAvgStay = nightsArr.length ? (Math.round((nightsArr.reduce((a, x) => a + x, 0) \u002F nightsArr.length) * 10) \u002F 10) + ' nuits' : '—';\n      const cancelledN = s.reservations.filter(r => r.status === 'annulee').length;\n      v.rpCancelRate = s.reservations.length ? (Math.round((cancelledN \u002F s.reservations.length) * 1000) \u002F 10) + ' %' : '—';\n      const restaTx = s.transactions.filter(x => x.type === 'recette' && x.service === 'Restaurant');\n      v.rpAvgBasket = restaTx.length ? fmt(Math.round(restaTx.reduce((a, x) => a + x.amount, 0) \u002F restaTx.length)) : '—';\n      v.rpKpis = [\n        { label: 'CA du mois', value: v.rpTotalTxt, tc: '#8A9186', trend: v.rpMonthLabel },\n        { label: 'RevPAR', value: v.rpRevPAR, tc: '#8A9186', trend: 'par chambre exploitable \u002F nuit' },\n        { label: 'Durée moyenne du séjour', value: v.rpAvgStay, tc: '#8A9186', trend: '' },\n        { label: 'Taux d\\'annulation', value: v.rpCancelRate, tc: '#8A9186', trend: '' },\n      ];\n      \u002F\u002F top clients réels\n      v.rpTopClients = [...s.clients].sort((a, b) => b.spent - a.spent).slice(0, 5).map((c, i) => ({\n        rank: i + 1, name: c.name, stays: c.stays + ' séjours', spentTxt: fmt(c.spent), vip: c.vip,\n        open: () => this.go('clients', { selClient: c.id }),\n      }));\n      v.rpExport = () => {\n        const rows = [['Indicateur', 'Valeur']];\n        rows.push(['CA du mois (' + v.rpMonthLabel + ')', v.rpTotalTxt]);\n        rows.push(['RevPAR', v.rpRevPAR]);\n        rows.push(['Durée moyenne du séjour', v.rpAvgStay]);\n        rows.push(['Taux d\\'annulation', v.rpCancelRate]);\n        rows.push(['Panier moyen restaurant', v.rpAvgBasket]);\n        rev.forEach(([label, amt]) => rows.push(['CA du mois — ' + label, fmt(amt)]));\n        const csv = '\ ur', 'Direction', 'Réceptionniste', 'Responsable réservations', 'Caissier', 'Responsable restaurant', 'Responsable spa', 'Responsable piscine', 'Housekeeping', 'Maintenance', 'Comptable', 'Responsable stock'];\n      v.acfRoles = allRoles.map(r => ({ r }));\n      const setA = (k) => e => this.setState(st => ({ acf: { ...st.acf, [k]: e.target.value } }));\n      v.acf = {\n        name: s.acf.name, setName: setA('name'),\n        pass: s.acf.pass, setPass: setA('pass'),\n        role: s.acf.role, setRole: setA('role'),\n        save: async () => {\n          const n = s.acf.name.trim();\n          if (!n) { this.toast('Le nom est obligatoire'); return; }\n          if ((s.acf.pass || '').length < 6) { this.toast('Mot de passe trop court (min. 6 caractères)'); return; }\n          if (s.accounts.some(a => a.name.toLowerCase() === n.toLowerCase())) { this.toast('Un compte existe déjà à ce nom'); return; }\n          const ok = await this.apiSetPassword(n, s.acf.pass);\n          if (!ok) { this.toast('Impossible d\\'enregistrer le mot de passe — vérifiez la connexion au serveur'); return; }\n          this.setState(st => ({\n            accounts: [...st.accounts, { id: Date.now(), name: n, role: st.acf.role, active: true }],\n            acf: { name: '', pass: '', role: st.acf.role },\n          }));\n          this.toast('Compte créé — ' + n + ' peut se connecter à l\\'espace ' + s.acf.role);\n        },\n      };\n      v.sgAccounts = s.accounts.map(a => ({\n        name: a.name, role: a.role,\n        passTxt: '••••••',\n        stTxt: a.active ? 'Actif' : 'Suspendu',\n        stBg: a.active ? '#E9F2ED' : '#F9EFEA', stFg: a.active ? '#2E7D57' : '#8C3B32',\n        toggleTxt: a.active ? 'Suspendre' : 'Réactiver',\n        resetOpen: s.pwResetId === a.id,\n        resetClosed: s.pwResetId !== a.id,\n        resetVal: s.pwResetId === a.id ? (s.pwResetVal || '') : '',\n        setResetVal: e => this.setState({ pwResetVal: e.target.value }),\n        openReset: () => this.setState({ pwResetId: a.id, pwResetVal: '' }),\n        cancelReset: () => this.setState({ pwResetId: null, pwResetVal: '' }),\n        confirmReset: async () => {\n          if ((this.state.pwResetVal || '').length < 6) { this.toast('Mot de passe trop court (min. 6 caractères)'); return; }\n          const ok = await this.apiSetPassword(a.name, this.state.pwResetVal);\n          if (!ok) { this.toast('Erreur lors de la réinitialisation — réessayez'); return; }\n          this.setState({ pwResetId: null, pwResetVal: '' });\n          this.logAct('Compte', 'Mot de passe de ' + a.name + ' réinitialisé');\n          this.toast('Mot de passe de ' + a.name + ' réinitialisé');\n        },\n        setRole: e => { this.setState(st => ({ accounts: st.accounts.map(x => x.id === a.id ? { ...x, role: e.target.value } : x) })); this.toast(a.name + ' → espace ' + e.target.value); },\n        toggle: () => { this.setState(st => ({ accounts: st.accounts.map(x => x.id === a.id ? { ...x, active: !x.active } : x) })); this.toast(a.name + (a.active ? ' suspendu — connexion bloquée' : ' réactivé')); },\n        del: () => { this.setState(st => ({ accounts: st.accounts.filter(x => x.id !== a.id) })); this.toast('Compte de ' + a.name + ' supprimé'); },\n      }));\n      v.sgSave = () => this.toast('Réglages enregistrés — appliqués à tous les postes');\n      if (isAdmin) {\n        \u002F\u002F --- gestion des chambres ---\n        const setR = (k) => e => this.setState(st => ({ rmf: { ...st.rmf, [k]: e.target.value } }));\n        v.rmf = {\n          no: s.rmf.no, setNo: setR('no'), floor: s.rmf.floor, setFloor: setR('floor'),\n          type: s.rmf.type, setType: setR('type'), cap: s.rmf.cap, setCap: setR('cap'),\n          save: () => {\n            const no = s.rmf.no.trim();\n            if (!no) { this.toast('Le n° ou nom de chambre est obligatoire'); return; }\n            if (s.rooms.some(r => r.no.toLowerCase() === no.toLowerCase())) { this.toast('Une chambre « ' + no + ' » existe déjà'); return; }\n            const price = s.typePrices[s.rmf.type] || 850;\n            this.setState(st => ({\n              rooms: [...st.rooms, { no, floor: +st.rmf.floor, type: st.rmf.type, cap: +st.rmf.cap || 2, price, status: 'libre', eq: ['Wi-Fi', 'Climatisation', 'TV satellite', 'Coffre-fort', 'Minibar'] }],\n              rmf: { ...st.rmf, no: '' },\n            }));\n            this.toast('Chambre « ' + no + ' » créée — ' + s.rmf.type + ', étage ' + s.rmf.floor);\n          },\n        };\n        v.sgRooms = s.rooms.map(r => {\n          const busy = s.reservations.some(x => x.room === r.no && (x.status === 'inhouse' || x.status === 'confirmee'));\n          return {\n            no: r.no, floor: r.floor, type: r.type, cap: r.cap,\n            canDel: !busy, locked: busy,\n            setNo: e => {\n              const nn = e.target.value;\n              this.setState(st => ({\n                rooms: st.rooms.map(x => x.no === r.no ? { ...x, no: nn } : x),\n                reservations: st.reservations.map(x => x.room === r.no ? { ...x, room: nn } : x),\n                hkTasks: st.hkTasks.map(x => x.room === r.no ? { ...x, room: nn } : x),\n              }));\n            },\n            setType: e => {\n              const tp = e.target.value;\n              this.setState(st => ({ rooms: st.rooms.map(x => x.no === r.no ? { ...x, type: tp, price: st.typePrices[tp] || x.price } : x) }));\n              this.toast('Chambre ' + r.no + ' → ' + tp);\n            },\n            setCap: e => this.setState(st => ({ rooms: st.rooms.map(x => x.no === r.no ? { ...x, cap: +e.target.value || 1 } : x) })),\n            del: () => { this.setState(st => ({ rooms: st.rooms.filter(x => x.no !== r.no) })); this.toast('Chambre ' + r.no + ' supprimée'); },\n          };\n        });\n        \u002F\u002F --- gestion des tables restaurant ---\n        const setTb = (k) => e => this.setState(st => ({ tbf: { ...st.tbf, [k]: e.target.value } }));\n        v.tbf = {\n          no: s.tbf.no, setNo: setTb('no'), seats: s.tbf.seats, setSeats: setTb('seats'),\n          save: () => {\n            const no = +s.tbf.no || 0;\n            if (!no) { this.toast('Le numéro de table est obligatoire'); return; }\n            if (s.tables.some(t => t.no === no)) { this.toast('Une table n° ' + no + ' existe déjà'); return; }\n            this.setState(st => ({\n              tables: [...st.tables, { no, seats: +st.tbf.seats || 2, status: 'libre' }],\n              tbf: { ...st.tbf, no: '' },\n            }));\n            this.toast('Table n° ' + no + ' créée');\n          },\n        };\n        v.sgTables = s.tables.map(t => {\n          const busy = t.status !== 'libre';\n          return {\n            no: t.no, seats: t.seats, canDel: !busy, locked: busy,\n            setSeats: e => this.setState(st => ({ tables: st.tables.map(x => x.no === t.no ? { ...x, seats: +e.target.value || 1 } : x) })),\n            del: () => { this.setState(st => ({ tables: st.tables.filter(x => x.no !== t.no) })); this.toast('Table n° ' + t.no + ' supprimée'); },\n          };\n        });\n        \u002F\u002F --- menu restaurant ---\n        const setMn = (k) => e => this.setState(st => ({ mnf: { ...st.mnf, [k]: e.target.value } }));\n        v.mnf = {\n          name: s.mnf.name, setName: setMn('name'), cat: s.mnf.cat, setCat: setMn('cat'),\n          price: s.mnf.price, setPrice: setMn('price'),\n          save: () => {\n            if (!s.mnf.name.trim()) { this.toast('Le nom du plat est obligatoire'); return; }\n            if (!(+s.mnf.price > 0)) { this.toast('Prix invalide'); return; }\n            this.setState(st => ({ menu: [...st.menu, { name: st.mnf.name.trim(), cat: st.mnf.cat, price: +st.mnf.price }], mnf: { ...st.mnf, name: '', price: '' } }));\n            this.toast('« ' + s.mnf.name.trim() + ' » ajouté au menu');\n          },\n        };\n        v.sgMenu = s.menu.map((m, i) => ({\n          name: m.name, cat: m.cat, price: m.price,\n          setName: e => this.setState(st => ({ menu: st.menu.map((x, j) => j === i ? { ...x, name: e.target.value } : x) })),\n          setPrice: e => this.setState(st => ({ menu: st.menu.map((x, j) => j === i ? { ...x, price: +e.target.value || 0 } : x) })),\n          del: () => { this.setState(st => ({ menu: st.menu.filter((_, j) => j !== i) })); this.toast('« ' + m.name + ' » retiré du menu'); },\n        }));\n        \u002F\u002F --- soins spa ---\n        const setSp = (k) => e => this.setState(st => ({ spf: { ...st.spf, [k]: e.target.value } }));\n        v.spf = {\n          name: s.spf.name, setName: setSp('name'), dur: s.spf.dur, setDur: setSp('dur'),\n          price: s.spf.price, setPrice: setSp('price'),\n          save: () => {\n            if (!s.spf.name.trim()) { this.toast('Le nom du soin est obligatoire'); return; }\n            if (!(+s.spf.price > 0)) { this.toast('Prix invalide'); return; }\n            this.setState(st => ({ spaServices: [...st.spaServices, { name: st.spf.name.trim(), dur: +st.spf.dur || 60, price: +st.spf.price }], spf: { ...st.spf, name: '', price: '' } }));\n            this.toast('« ' + s.spf.name.trim() + ' » ajouté à la carte des soins');\n          },\n        };\n        v.sgSpa = (s.spaServices || []).map((sv, i) => ({\n          name: sv.name, dur: sv.dur, price: sv.price,\n          setName: e => this.setState(st => ({ spaServices: st.spaServices.map((x, j) => j === i ? { ...x, name: e.target.value } : x) })),\n          setDur: e => this.setState(st => ({ spaServices: st.spaServices.map((x, j) => j === i ? { ...x, dur: +e.target.value || 60 } : x) })),\n          setPrice: e => this.setState(st => ({ spaServices: st.spaServices.map((x, j) => j === i ? { ...x, price: +e.target.value || 0 } : x) })),\n          del: () => { this.setState(st => ({ spaServices: st.spaServices.filter((_, j) => j !== i) })); this.toast('« ' + sv.name + ' » retiré de la carte'); },\n        }));\n        \u002F\u002F --- terrains de foot ---\n        const fof = s.fof || { name: '', dur: '', price: '' };\n        const setFo = (k) => e => this.setState(st => ({ fof: { ...(st.fof || { name: '', dur: '', price: '' }), [k]: e.target.value } }));\n        v.fof = {\n          name: fof.name, setName: setFo('name'), dur: fof.dur, setDur: setFo('dur'),\n          price: fof.price, setPrice: setFo('price'),\n          save: () => {\n            if (!fof.name.trim()) { this.toast('Le nom du terrain est obligatoire'); return; }\n            if (!(+fof.price > 0)) { this.toast('Prix invalide'); return; }\n            this.setState(st => ({ footFields: [...(st.footFields || []), { name: fof.name.trim(), dur: +fof.dur || 60, price: +fof.price }], fof: { ...(st.fof || {}), name: '', price: '' } }));\n            this.toast('« ' + fof.name.trim() + ' » ajouté aux terrains');\n          },\n        };\n        v.sgFoot = (s.footFields || []).map((sv, i) => ({\n          name: sv.name, dur: sv.dur, price: sv.price,\n          setName: e => this.setState(st => ({ footFields: st.footFields.map((x, j) => j === i ? { ...x, name: e.target.value } : x) })),\n          setDur: e => this.setState(st => ({ footFields: st.footFields.map((x, j) => j === i ? { ...x, dur: +e.target.value || 60 } : x) })),\n          setPrice: e => this.setState(st => ({ footFields: st.footFields.map((x, j) => j === i ? { ...x, price: +e.target.value || 0 } : x) })),\n          del: () => { this.setState(st => ({ footFields: st.footFields.filter((_, j) => j !== i) })); this.toast('« ' + sv.name + ' » retiré des terrains'); },\n        }));\n      }\n    }\n\n    return v;\n  }\n}\n\n<\u002Fscript>\n\n\n\n<script src=\"sync-adapter.js\" defer><\u002Fscript>\n<\u002Fbody><\u002Fhtml>"
